<h2>Willkommen bei ChoreoFlow</h2>
<p>Bestätige deine E-Mail-Adresse, um dein ChoreoFlow-Testkonto zu aktivieren.</p>
<p><a href="{{ .ConfirmationURL }}">E-Mail-Adresse bestätigen</a></p>
<p>Danach kannst du dich mit deiner E-Mail-Adresse und deinem Passwort in ChoreoFlow anmelden.</p>
<p>Wenn du kein Konto angelegt hast, kannst du diese Nachricht ignorieren.</p>
